<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%ui.metaDescription%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Explicit .ico link so Vite rewrites it with the Pages base path — an
         unlinked /favicon.ico fallback 404s at <user>.github.io/favicon.ico. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fonts self-hosted via src/index.css @font-face (latin subsets,
         SPEC §11.4): no render-blocking fonts.googleapis.com chain. -->
    <title>%ui.docTitle%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
